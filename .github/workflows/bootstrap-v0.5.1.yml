name: publish-tested-v0.5.1
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.event.pull_request.title == 'Publish exact tested Immutavault v0.5.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every archive chunk and exact audited source archive
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parts.sha256 <<'EOF'
          f00f04d7abc9f3258a981394f114c5592d72e3eb50e7c9915b465824f45ebe74  .bootstrap/part-00
          2585f4c47dc74a5df788531e5e8d10b476366b3718b437611ba77e1169426916  .bootstrap/part-01
          c8275cd4ba9a420319cc8975668c0d42963d9d240bcba921152176ca0eac8161  .bootstrap/part-02
          456bd095db25dcf5a037b7e64f4989670cd6fabcc833a630c1647dcaaa38d308  .bootstrap/part-03
          372fccb0112d896a1561c9e74517dae6cd139505bc4932f1b87bcf5e5ad5b63f  .bootstrap/part-04
          0a246f75388261ad4f1551fb62f155b8118af1948865d0290c4072a482bd89a3  .bootstrap/part-05
          fb88123a1034714f5febcc20490d3cbd26b648f41d68f39b5431e7630a349a62  .bootstrap/part-06
          3bad0c05d0872d4612bfa9224ac59dda22013809de54959a871df88d89a5b46e  .bootstrap/part-07
          b9efd75b6d112c062ba3b20caf8991aa00c55dab130756b776732f5abba0748e  .bootstrap/part-08
          51fdc8e9d21310cd783e8af9cd208b143455e4578eac4e097db37da8edf5065b  .bootstrap/part-09
          7c62ab088a7eb38f7075b0407ee1ff169f99f667b90aba9f47e6b40752912422  .bootstrap/part-10
          dfc728a0c7ef4580725ffa442a199d0e3356c7f3f1b2124390ee17f131af988e  .bootstrap/part-11
          0d85acb1ea4c0267019cbefac6426527a652794ce52a31b4de9869d925a56e68  .bootstrap/part-12
          7a20c3ac57104f31db67fcecbad693ce09df9c3cc7666c114af2e46d2fd74213  .bootstrap/part-13
          556b292823d53f8d340d3e74f2ddb344913518d008ffb4bf992ef30280d58ba1  .bootstrap/part-14
          e838f54724ceb3ae0abd7822f4b7a2cf5ef011c8498b57794db00b2a23468da3  .bootstrap/part-15
          14438ac2c9e3dd0077bad7e80f8717023a22ae4fac1701d02d1fa90da1d54e45  .bootstrap/part-16
          04fc3b187335076f16f1a42b24c78567aeb56ae50ca0ea3840598eb11c9d4201  .bootstrap/part-17
          53a4a2aba69e9b36eb12924b052110bf1dfa9940b4a268cd2c4c4eb6f862d896  .bootstrap/part-18
          be5f435495eabf872b5c842be6ed2f89b5ed1ce1eb80c62c4cdce0300d98d977  .bootstrap/part-19
          401d834cd8c7473e954497ff6f4c94f494520a1d701a03719c2da1036736688e  .bootstrap/part-20
          f18e8fedf5d7a0812db3bcd404a9693700df3aeec59939d585483b326823ec81  .bootstrap/part-21
          ed4ad59f101c28686d60c62a9def6f2f03ec0fef6ceb656cf1a793e3f7b56717  .bootstrap/part-22
          EOF
          sha256sum -c /tmp/parts.sha256
          cat .bootstrap/part-* > /tmp/immutavault.b64
          base64 -d /tmp/immutavault.b64 > /tmp/release.tar.gz
          echo 'b0c3f71cc277700e5ac74426371355ab792eacfa72719df40dbe21bf95de5648  /tmp/release.tar.gz' | sha256sum -c -
      - name: Publish v0.5.1 source while preserving workflow permission boundary
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml /tmp/ci.yml
          cp .github/workflows/bootstrap-v0.5.1.yml /tmp/bootstrap.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/release.tar.gz -C .
          cp /tmp/ci.yml .github/workflows/ci.yml
          cp /tmp/bootstrap.yml .github/workflows/bootstrap-v0.5.1.yml
          rm -rf .bootstrap
          git config user.name 'Immutavault Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Immutavault v0.5.1 audited source payload'
          git push origin HEAD:main
