name: tag-v0.5.1
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  tag:
    if: ${{ github.event.pull_request.title == 'Create Immutavault v0.5.1 release tag' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag tested product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Immutavault Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git tag -f v0.5.1 15d7302fd6fc463ad4cd0863bfd553f8a10848d3
          git push origin refs/tags/v0.5.1 --force
