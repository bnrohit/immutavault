name: Guarded v0.6 delta publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feature/guided-setup-v0.6-finalize' && contains(github.event.pull_request.body, 'PUBLISH-V060-91c8e159')
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and apply audited delta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .v060-release ]]; then
            echo 'Staging directory already consumed; nothing to publish.'
            exit 0
          fi
          test "$(find .v060-release -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 7
          cat .v060-release/part-* > /tmp/v060.b64
          base64 --decode /tmp/v060.b64 > /tmp/v060_delta.tar.gz
          echo '91c8e159a2ae33f7cd04fda739b00f204d20460ba5f5f12c9d89ad5e4c57a450  /tmp/v060_delta.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v060_delta.tar.gz
          tar -xzf /tmp/v060_delta.tar.gz -C .
          rm -rf .v060-release
          test "$(tr -d '[:space:]' < VERSION)" = '0.6.0'
          grep -q 'version = "0.6.0"' pyproject.toml
          grep -q 'RPO Status' src/immutavault/setup_wizard.py
          grep -q 'Immutable-Copy Verification' src/immutavault/setup_wizard.py

      - name: Commit exact audited delta to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'immutavault-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize v0.6.0 guided management appliance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
