name: tag v0.9.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/tag-v0.9.0.yml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create immutable v0.9.0 tag on tested release commit
        env:
          TARGET: 66572966d2061bdbfe1621e36206b0d29dbc7bf3
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.9.0 >/dev/null; then
            ACTUAL=$(git rev-parse 'v0.9.0^{}')
            test "$ACTUAL" = "$TARGET" || { echo "v0.9.0 already exists at $ACTUAL, refusing to move it" >&2; exit 1; }
          else
            git config user.name "Rohith Bommalla Naresh"
            git config user.email "bnr756@gmail.com"
            git tag -a v0.9.0 "$TARGET" -m "Immutavault v0.9.0 — Enterprise Operations and Ecosystem"
            git push origin refs/tags/v0.9.0
          fi
      - name: Remove one-time workflow from main
        run: |
          set -euo pipefail
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git rm .github/workflows/tag-v0.9.0.yml
          git commit -m "Remove one-time v0.9.0 tag workflow"
          git push origin HEAD:main
