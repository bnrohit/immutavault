name: v0.8 apply schema and catalog patch
on:
  push:
    branches: [feature/v0.8-flr-app-consistency]
    paths: [.github/workflows/v08-apply-schema-engine.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.8-flr-app-consistency
      - name: Apply targeted v0.8 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/immutavault/config.py')
          s = p.read_text()
          old = '''@dataclass(frozen=True)\nclass PortalConfig:\n    enabled: bool = True\n    listen: str = "127.0.0.1"\n    port: int = 8787\n    tls_cert: str | None = None\n    tls_key: str | None = None\n    users: list[PortalUserConfig] = field(default_factory=list)\n\n\n@dataclass(frozen=True)\nclass ReplicaConfig:'''
          new = '''@dataclass(frozen=True)\nclass PortalConfig:\n    enabled: bool = True\n    listen: str = "127.0.0.1"\n    port: int = 8787\n    tls_cert: str | None = None\n    tls_key: str | None = None\n    users: list[PortalUserConfig] = field(default_factory=list)\n\n\n@dataclass(frozen=True)\nclass FLRConfig:\n    enabled: bool = True\n    mount_root: str = "/srv/immutavault/flr"\n    session_ttl_minutes: int = 30\n    max_download_bytes: int = 5 * 1024 * 1024 * 1024\n    max_sessions_per_user: int = 2\n    max_disks: int = 16\n    mount_wait_seconds: int = 30\n\n\n@dataclass(frozen=True)\nclass ReplicaConfig:'''
          assert old in s, 'PortalConfig anchor changed'
          s = s.replace(old, new, 1)

          old = '''class Config:\n    repository: RepositoryConfig\n    runtime: RuntimeConfig\n    platforms: list[PlatformConfig]\n    protection: ProtectionConfig = field(default_factory=ProtectionConfig)\n    portal: PortalConfig = field(default_factory=PortalConfig)\n    replicas: list[ReplicaConfig] = field(default_factory=list)'''
          new = '''class Config:\n    repository: RepositoryConfig\n    runtime: RuntimeConfig\n    platforms: list[PlatformConfig]\n    protection: ProtectionConfig = field(default_factory=ProtectionConfig)\n    portal: PortalConfig = field(default_factory=PortalConfig)\n    flr: FLRConfig = field(default_factory=FLRConfig)\n    replicas: list[ReplicaConfig] = field(default_factory=list)'''
          assert old in s, 'Config anchor changed'
          s = s.replace(old, new, 1)

          old = '''    protection_raw = raw.get("protection") or {}\n    portal_raw = raw.get("portal") or {}\n    platforms_raw = raw.get("platforms") or []'''
          new = '''    protection_raw = raw.get("protection") or {}\n    portal_raw = raw.get("portal") or {}\n    flr_raw = raw.get("flr") or {}\n    platforms_raw = raw.get("platforms") or []'''
          assert old in s, 'raw config anchor changed'
          s = s.replace(old, new, 1)

          old = '''    portal = PortalConfig(\n        enabled=bool(portal_raw.get("enabled", True)),\n        listen=str(portal_raw.get("listen", "127.0.0.1")),\n        port=portal_port,\n        tls_cert=portal_raw.get("tls_cert"),\n        tls_key=portal_raw.get("tls_key"),\n        users=users,\n    )\n\n    platforms: list[PlatformConfig] = []'''
          new = '''    portal = PortalConfig(\n        enabled=bool(portal_raw.get("enabled", True)),\n        listen=str(portal_raw.get("listen", "127.0.0.1")),\n        port=portal_port,\n        tls_cert=portal_raw.get("tls_cert"),\n        tls_key=portal_raw.get("tls_key"),\n        users=users,\n    )\n\n    flr_mount_root = str(flr_raw.get("mount_root", "/srv/immutavault/flr"))\n    if not flr_mount_root.startswith("/"):\n        raise ValueError("flr.mount_root must be an absolute path")\n    flr_ttl = _positive_int(flr_raw.get("session_ttl_minutes", 30), "flr.session_ttl_minutes", minimum=1)\n    if flr_ttl > 240:\n        raise ValueError("flr.session_ttl_minutes must be <= 240")\n    flr_download = _positive_int(flr_raw.get("max_download_bytes", 5 * 1024 * 1024 * 1024), "flr.max_download_bytes", minimum=1)\n    if flr_download > 1024 * 1024 * 1024 * 1024:\n        raise ValueError("flr.max_download_bytes must be <= 1 TiB")\n    flr_sessions = _positive_int(flr_raw.get("max_sessions_per_user", 2), "flr.max_sessions_per_user", minimum=1)\n    if flr_sessions > 16:\n        raise ValueError("flr.max_sessions_per_user must be <= 16")\n    flr_disks = _positive_int(flr_raw.get("max_disks", 16), "flr.max_disks", minimum=1)\n    if flr_disks > 64:\n        raise ValueError("flr.max_disks must be <= 64")\n    flr_wait = _positive_int(flr_raw.get("mount_wait_seconds", 30), "flr.mount_wait_seconds", minimum=1)\n    if flr_wait > 180:\n        raise ValueError("flr.mount_wait_seconds must be <= 180")\n    flr = FLRConfig(\n        enabled=bool(flr_raw.get("enabled", True)),\n        mount_root=flr_mount_root,\n        session_ttl_minutes=flr_ttl,\n        max_download_bytes=flr_download,\n        max_sessions_per_user=flr_sessions,\n        max_disks=flr_disks,\n        mount_wait_seconds=flr_wait,\n    )\n\n    platforms: list[PlatformConfig] = []'''
          assert old in s, 'portal parse anchor changed'
          s = s.replace(old, new, 1)

          old = '''        protection=protection,\n        portal=portal,\n        replicas=replicas,'''
          new = '''        protection=protection,\n        portal=portal,\n        flr=flr,\n        replicas=replicas,'''
          assert old in s, 'Config return anchor changed'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/immutavault/engine.py')
          s = p.read_text()
          old = 'from .integrity import build_manifest, verify_manifest\n'
          new = 'from .consistency import point_consistency, read_consistency\nfrom .integrity import build_manifest, verify_manifest\n'
          assert old in s, 'engine import anchor changed'
          s = s.replace(old, new, 1)

          old = '''            exported = adapter.export(vm, staging_root)\n            manifest, manifest_digest = build_manifest(staging_root)'''
          new = '''            exported = adapter.export(vm, staging_root)\n            application_consistency = read_consistency(exported) or {\n                "state": "snapshot-consistent",\n                "method": f"{platform.type}-snapshot-export",\n                "requested": False,\n                "strict": False,\n                "provider_attested": False,\n                "application_consistent": False,\n                "detail": "transport did not publish an application-consistency attestation",\n            }\n            manifest, manifest_digest = build_manifest(staging_root)'''
          assert old in s, 'engine export anchor changed'
          s = s.replace(old, new, 1)

          old = '''                "metadata_json": json.dumps({"exported": str(exported), "vm_kind": vm.kind, "platform_info": platform_info}),'''
          new = '''                "metadata_json": json.dumps({\n                    "exported": str(exported),\n                    "vm_kind": vm.kind,\n                    "platform_info": platform_info,\n                    "application_consistency": application_consistency,\n                }),'''
          assert old in s, 'engine metadata anchor changed'
          s = s.replace(old, new, 1)

          old = '''                "replicas": replica_results,\n                "verified": verified,'''
          new = '''                "replicas": replica_results,\n                "verified": verified,\n                "application_consistency": application_consistency,'''
          assert old in s, 'engine result anchor changed'
          s = s.replace(old, new, 1)

          old = '''        for point in points:\n            score = 100'''
          new = '''        for point in points:\n            point["application_consistency"] = point_consistency(point)\n            score = 100'''
          assert old in s, 'engine point-list anchor changed'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/v08-apply-schema-engine.yml
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git add src/immutavault/config.py src/immutavault/engine.py .github/workflows/v08-apply-schema-engine.yml
          git commit -m "Add validated FLR schema and consistency catalog metadata"
          git push origin HEAD:feature/v0.8-flr-app-consistency
