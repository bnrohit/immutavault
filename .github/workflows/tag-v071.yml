name: One-time v0.7.1 tag

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.head.ref == 'release/tag-v0.7.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create v0.7.1 release tag
        shell: bash
        run: |
          set -euo pipefail
          target='49acb0a8b304a17c56a8e243cadfd303f313abd3'
          existing="$(git ls-remote --tags origin refs/tags/v0.7.1 | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$target" ]]; then
              echo "v0.7.1 already points to $existing, expected $target" >&2
              exit 1
            fi
            echo 'v0.7.1 already points to verified product commit.'
            exit 0
          fi
          git tag v0.7.1 "$target"
          git push origin refs/tags/v0.7.1
