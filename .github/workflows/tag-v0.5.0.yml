name: tag-v0.5.0
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  tag:
    if: ${{ github.event.pull_request.title == 'Create Immutavault v0.5.0 release tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag exact tested release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Immutavault Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git tag -f v0.5.0 b8126e4d758859c6901867b00dc903c1eb9f7dc4
          git push origin refs/tags/v0.5.0 --force
