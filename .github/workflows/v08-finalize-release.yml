name: v0.8 finalize release tree
on:
  push:
    branches: [feature/v0.8-flr-app-consistency]
    paths: [.github/workflows/v08-finalize-release.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.8-flr-app-consistency
      - name: Apply v0.8 release integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              if count == 0:
                  s = s.replace(old, new)
              else:
                  s = s.replace(old, new, count)
              p.write_text(s)

          # FLR runtime uses the validated YAML schema by default.
          patch(
              'src/immutavault/flr.py',
              '        self.settings = settings or FLRSettings.from_environment()\n',
              '''        if settings is not None:\n            self.settings = settings\n        elif hasattr(cfg, "flr"):\n            self.settings = FLRSettings(\n                enabled=cfg.flr.enabled,\n                mount_root=cfg.flr.mount_root,\n                session_ttl_minutes=cfg.flr.session_ttl_minutes,\n                max_download_bytes=cfg.flr.max_download_bytes,\n                max_sessions_per_user=cfg.flr.max_sessions_per_user,\n                max_disks=cfg.flr.max_disks,\n                mount_wait_seconds=cfg.flr.mount_wait_seconds,\n            )\n        else:\n            self.settings = FLRSettings.from_environment()\n''',
          )

          # Production example: validated FLR policy + strict app consistency.
          patch(
              'config/immutavault.example.yml',
              '''    - name: "vault-admin"\n      role: "admin"\n      token_env: "IMMUTAVAULT_ADMIN_TOKEN"\n      sources: ["*"]\n      vm_patterns: ["*"]\n\nplatforms:\n''',
              '''    - name: "vault-admin"\n      role: "admin"\n      token_env: "IMMUTAVAULT_ADMIN_TOKEN"\n      sources: ["*"]\n      vm_patterns: ["*"]\n\nflr:\n  enabled: true\n  mount_root: "/srv/immutavault/flr"\n  session_ttl_minutes: 30\n  max_download_bytes: 5368709120\n  max_sessions_per_user: 2\n  max_disks: 16\n  mount_wait_seconds: 30\n\nplatforms:\n''',
          )
          patch(
              'config/immutavault.example.yml',
              '      quiesce_fallback_crash_consistent: false\n      tls_ca_certs:',
              '      quiesce_fallback_crash_consistent: false\n      application_consistency_strict: true\n      tls_ca_certs:',
              count=0,
          )
          patch(
              'config/vmware-incremental.example.yml',
              '# VMware native-incremental overlay example for Immutavault v0.7.1.',
              '# VMware native-incremental + application-consistency overlay for Immutavault v0.8.0.',
          )
          patch(
              'config/vmware-incremental.example.yml',
              '      quiesce_fallback_crash_consistent: false\n\n      # v0.7.1 native incremental policy.',
              '      quiesce_fallback_crash_consistent: false\n      application_consistency_strict: true\n\n      # v0.7.1+ native incremental policy, retained by v0.8.0.',
          )

          # Install FLR prerequisites and mount root.
          patch(
              'scripts/install_appliance.sh',
              '    bzip2 openssh-client openssl apache2-utils smartmontools curl ca-certificates nfs-common cifs-utils\n',
              '    bzip2 openssh-client openssl apache2-utils smartmontools curl ca-certificates nfs-common cifs-utils \\\n    fuse3 libguestfs-tools qemu-utils\n',
          )
          patch(
              'scripts/install_appliance.sh',
              '    bzip2 openssh-clients openssl httpd-tools smartmontools curl ca-certificates nfs-utils cifs-utils\n',
              '    bzip2 openssh-clients openssl httpd-tools smartmontools curl ca-certificates nfs-utils cifs-utils fuse3 qemu-img\n  dnf install -y libguestfs-tools-c || dnf install -y libguestfs-tools\n',
          )
          patch(
              'scripts/install_appliance.sh',
              '    bzip2 openssh-clients openssl httpd-tools smartmontools curl ca-certificates nfs-utils cifs-utils\nelse\n',
              '    bzip2 openssh-clients openssl httpd-tools smartmontools curl ca-certificates nfs-utils cifs-utils fuse3 qemu-img\n  yum install -y libguestfs-tools-c || yum install -y libguestfs-tools\nelse\n',
          )
          patch(
              'scripts/install_controller.sh',
              'install -d -o immutavault -g immutavault -m 0750 /var/lib/immutavault "$ROOT/staging" "$ROOT/restore-staging" "$ROOT/verify-staging"\n',
              '''install -d -o immutavault -g immutavault -m 0750 /var/lib/immutavault "$ROOT/staging" "$ROOT/restore-staging" "$ROOT/verify-staging"\ninstall -d -o immutavault -g immutavault -m 0700 "$ROOT/flr"\nif getent group fuse >/dev/null 2>&1; then\n  usermod -a -G fuse immutavault\nfi\n''',
          )

          # FUSE un/mount helper must be able to use its packaged privilege path,
          # but the service remains the unprivileged immutavault identity.
          patch(
              'systemd/immutavault-portal.service',
              'NoNewPrivileges=true\nPrivateTmp=true\n',
              '''# FUSE3 fusermount is commonly setuid-root. no_new_privs would block the\n# kernel mount helper even though the portal itself remains User=immutavault.\nNoNewPrivileges=false\nPrivateTmp=true\nPrivateDevices=false\n''',
          )

          # Preflight surfaces FLR host readiness separately.
          patch(
              'scripts/preflight.sh',
              'command -v smartctl >/dev/null && pass "SMART tooling available" || warn "smartctl missing"\n\nMEM_KIB=',
              '''command -v smartctl >/dev/null && pass "SMART tooling available" || warn "smartctl missing"\nif bash "$(dirname "$0")/check_flr.sh" >/tmp/immutavault-flr.$$ 2>&1; then\n  pass "FLR/FUSE/libguestfs prerequisites"\nelse\n  warn "FLR prerequisites are incomplete; file-level recovery will be unavailable until fixed"\n  cat /tmp/immutavault-flr.$$\nfi\nrm -f /tmp/immutavault-flr.$$\n\nMEM_KIB=''',
          )

          # VMware runbook: preserve v0.7.1 transport safety and add v0.8 app-consistency contract.
          patch('docs/VMWARE_BACKUP.md', 'Immutavault v0.7.1 supports two VMware backup policies:', 'Immutavault v0.8.0 supports two VMware backup policies:')
          patch(
              'docs/VMWARE_BACKUP.md',
              '      quiesce_fallback_crash_consistent: false\n      vddk_transport_order:',
              '      quiesce_fallback_crash_consistent: false\n      application_consistency_strict: true\n      vddk_transport_order:',
          )
          patch(
              'docs/VMWARE_BACKUP.md',
              '## Provider protocol contract\n',
              '''## v0.8 application-consistency contract\n\n`application_consistency_strict: true` is independent of incremental strictness. It means a successful backup must also prove the requested guest/application consistency state.\n\nFor `hot-clone-export`, successful VMware Tools quiescing is recorded as `guest-quiesced`; if crash-consistent fallback is configured and used, the recovery point is explicitly recorded as `crash-consistent`. Strict application consistency requires `quiesce: true` and `quiesce_fallback_crash_consistent: false`.\n\nFor VDDK/CBT, the external provider receives `application_consistency_strict` in the protocol-v1 request. A strict provider success must include a `consistency` object whose state is `application-consistent` or `guest-quiesced`. Missing/unknown attestation fails closed before checkpoint advancement. The adapter then invalidates the uncertain cache, so consistency failure cannot contaminate the next CBT chain.\n\nThe attestation is stored in `.immutavault-consistency.json`, included in the immutable payload, and copied into the recovery-point catalog. `guest-quiesced` proves VMware accepted guest quiescing; actual VSS/database/application-writer coverage must still be validated on the workload.\n\nSee `docs/FILE_LEVEL_RECOVERY.md` for how the same recovery point is exposed read-only for single-file recovery.\n\n## Provider protocol contract\n''',
          )
          patch(
              'docs/VMWARE_BACKUP.md',
              '- return a non-empty per-disk checkpoint object.\n',
              '- return a non-empty per-disk checkpoint object; and\n- when strict application consistency is requested, return an accepted consistency attestation.\n',
          )

          # Installation and acceptance documentation.
          patch(
              'docs/INSTALLATION.md',
              '- Reliable storage mounted before Immutavault services start.\n',
              '''- Reliable storage mounted before Immutavault services start.\n- For v0.8 file-level recovery: FUSE 3, libguestfs (`guestmount`/`guestunmount`) and qemu image tooling on the controller/portal host. The supported appliance installer installs these packages where available.\n''',
          )
          patch(
              'docs/PRODUCTION_ACCEPTANCE.md',
              '## Phase 4 - replica/cloud/NAS\n',
              '''## Phase 3B - application consistency and file-level recovery\n\nFor each guest filesystem/workload class that will use FLR:\n\n1. Configure the intended application policy. Strict VMware examples use `quiesce: true`, `quiesce_fallback_crash_consistent: false`, and `application_consistency_strict: true`.\n2. Confirm the recovery point records the expected consistency state; do not treat `unknown`, `unattested`, or `crash-consistent` as application-consistent.\n3. `restic`, `guestmount`, `guestunmount`, FUSE and `/dev/fuse` are usable by the portal service identity.\n4. Open an FLR session on a disposable point and browse a nested NTFS/ext4/XFS path as applicable.\n5. Download a known file and compare SHA-256 with the source.\n6. Confirm `../` traversal is rejected and a guest symlink cannot be used as a download path.\n7. Confirm one restore operator cannot browse another operator's FLR session.\n8. Close/expire the session and verify both guest and restic FUSE mounts disappear.\n9. For VDDK/CBT strict application consistency, inject a provider success without `consistency`; the backup must fail and the CBT checkpoint must not advance.\n10. For native VDDK FLR, verify the provider layout exposes tested read-only `flr_disk_images`; otherwise FLR must fail explicitly rather than reconstructing an uncertain disk.\n\n## Phase 4 - replica/cloud/NAS\n''',
          )

          # README v0.8 release-facing changes.
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('# Immutavault v0.7.1\n', '# Immutavault v0.8.0\n', 1)
          s = s.replace('> **Readiness statement:** v0.7.1 is a production-pilot candidate.', '> **Readiness statement:** v0.8.0 is a production-pilot candidate with read-only file-level recovery and explicit application-consistency attestations.', 1)
          s = s.replace('## What v0.7.1 includes\n\n', '''## What v0.8.0 includes\n\n- **Granular file-level recovery (FLR):** browse a recovery point through short-lived read-only restic FUSE + libguestfs mounts and download one regular file without restoring the whole VM.\n- Owner-scoped FLR sessions, TTL/concurrency/download limits, traversal rejection, symlink blocking and audit events.\n- Application-consistency metadata stored in the immutable payload and recovery-point catalog.\n- `application_consistency_strict: true` for VMware; VDDK provider success without accepted consistency attestation fails closed before CBT checkpoint advancement.\n''', 1)
          s = s.replace('git checkout v0.7.1', 'git checkout v0.8.0', 1)
          anchor = '      quiesce_fallback_crash_consistent: false\n      vddk_transport_order:'
          assert anchor in s
          s = s.replace(anchor, '      quiesce_fallback_crash_consistent: false\n      application_consistency_strict: true\n      vddk_transport_order:', 1)
          anchor = 'Broadcom VDDK itself is **not bundled**. The configured helper must implement the documented protocol-v1 capability/backup/restore contract. See `docs/VMWARE_BACKUP.md`.\n\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '''## Application consistency and file-level recovery\n\nEvery v0.8 backup records the consistency state published by its transport. Strict VMware application consistency refuses silent crash-consistent downgrade. For native VDDK/CBT, the external provider must attest an accepted consistency state before the checkpoint can advance.\n\nThe recovery portal adds a **Files** action. It mounts the encrypted restic snapshot with `--no-lock`, exposes supported guest disks using `guestmount --ro`, and streams only the selected regular file. The repository remains immutable and the portal receives no prune/delete authority. FLR sessions expire automatically and reject path traversal, symlink following, special-file downloads and cross-user session access.\n\n```yaml\nflr:\n  enabled: true\n  mount_root: /srv/immutavault/flr\n  session_ttl_minutes: 30\n  max_download_bytes: 5368709120\n  max_sessions_per_user: 2\n```\n\nSee `docs/FILE_LEVEL_RECOVERY.md` for supported disk exposure, VDDK helper integration and acceptance tests.\n\n''', 1)
          s = s.replace('- `docs/VMWARE_BACKUP.md` - native VDDK/CBT, strict mode and hot-clone fallback policy\n', '- `docs/VMWARE_BACKUP.md` - native VDDK/CBT, strict mode, application consistency and hot-clone fallback policy\n- `docs/FILE_LEVEL_RECOVERY.md` - v0.8 read-only granular file recovery\n', 1)
          p.write_text(s)

          # Release version metadata.
          Path('VERSION').write_text('0.8.0\n')
          patch('pyproject.toml', 'version = "0.7.1"', 'version = "0.8.0"')
          patch('src/immutavault/__init__.py', '__version__ = "0.7.1"', '__version__ = "0.8.0"')

          # Release gate now requires v0.8 FLR/app-consistency assets.
          patch(
              'scripts/release_check.sh',
              "incremental_example = Path('config/vmware-incremental.example.yml').read_text()\n",
              "incremental_example = Path('config/vmware-incremental.example.yml').read_text()\nflr_doc = Path('docs/FILE_LEVEL_RECOVERY.md').read_text()\nflr_code = Path('src/immutavault/flr.py').read_text()\nconfig_example = Path('config/immutavault.example.yml').read_text()\n",
          )
          patch(
              'scripts/release_check.sh',
              "assert 'incremental_fallback: false' in incremental_example\nprint(version)\n",
              """assert 'incremental_fallback: false' in incremental_example\nassert 'application_consistency_strict: true' in incremental_example\nassert 'flr:' in config_example and 'mount_root: \"/srv/immutavault/flr\"' in config_example\nfor token in ('restic mount', 'guestmount --ro', 'path traversal', 'symlink'):\n    assert token in flr_doc, f'FLR runbook missing safety token: {token}'\nfor token in ('--no-lock', 'guestmount', 'does not follow guest symlinks', 'max_download_bytes'):\n    assert token in flr_code, f'FLR implementation missing required safety token: {token}'\nassert 'File-level recovery' in readme and 'application_consistency_strict: true' in readme\nprint(version)\n""",
          )
          patch(
              'scripts/release_check.sh',
              "grep -q 'EnvironmentFile=/etc/immutavault/repository.env' systemd/immutavault-rest-server.service || fail 'rest-server still receives controller environment'\npass 'restic/rest-server installs are pinned, checksummed, capability-gated, and privilege-separated'\n",
              """grep -q 'EnvironmentFile=/etc/immutavault/repository.env' systemd/immutavault-rest-server.service || fail 'rest-server still receives controller environment'\ngrep -q 'libguestfs-tools' scripts/install_appliance.sh || fail 'appliance installer lacks FLR libguestfs dependency'\ngrep -q 'fuse3' scripts/install_appliance.sh || fail 'appliance installer lacks FUSE3 dependency'\ngrep -q 'guestmount' scripts/check_flr.sh || fail 'FLR prerequisite checker is missing guestmount gate'\ngrep -q 'NoNewPrivileges=false' systemd/immutavault-portal.service || fail 'portal service cannot use packaged FUSE mount helper'\npass 'restic/rest-server installs are pinned, checksummed, capability-gated, and privilege-separated'\npass 'FLR FUSE/libguestfs installation contract is present'\n""",
          )
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/v08-finalize-release.yml
          chmod +x scripts/check_flr.sh
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git add -A
          git commit -m "Finalize Immutavault v0.8.0 FLR and application consistency"
          git push origin HEAD:feature/v0.8-flr-app-consistency
