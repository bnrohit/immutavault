name: tag v1.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/tag-v1.0.0.yml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create immutable v1.0.0 tag on tested release commit
        env:
          TARGET: 8a7009cab3e15b0af376ac39c0b986f11ddcddbd
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            ACTUAL=$(git rev-parse 'v1.0.0^{}')
            test "$ACTUAL" = "$TARGET" || { echo "v1.0.0 already exists at $ACTUAL, refusing to move it" >&2; exit 1; }
          else
            git config user.name "Rohith Bommalla Naresh"
            git config user.email "bnr756@gmail.com"
            git tag -a v1.0.0 "$TARGET" -m "Immutavault v1.0.0 — Certified Enterprise DR and Seamless V2V"
            git push origin refs/tags/v1.0.0
          fi
      - name: Remove one-time workflow from main
        run: |
          set -euo pipefail
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git rm .github/workflows/tag-v1.0.0.yml
          git commit -m "Remove one-time v1.0.0 tag workflow"
          git push origin HEAD:main
