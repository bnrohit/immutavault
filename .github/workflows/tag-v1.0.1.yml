name: tag v1.0.1
on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create immutable v1.0.1 tag on tested release commit
        run: |
          set -euo pipefail
          RELEASE_SHA=29477ee3c1dd2709ae61a8c6cec2018cc1a20e11
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.0.1 >/dev/null; then
            echo "v1.0.1 already exists; refusing to move it" >&2
            exit 1
          fi
          git cat-file -e "${RELEASE_SHA}^{commit}"
          test "$(git show "${RELEASE_SHA}:VERSION")" = "1.0.1"
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git tag -a v1.0.1 "$RELEASE_SHA" -m "Immutavault v1.0.1 — FLR privilege separation and V2V readiness hardening"
          git push origin refs/tags/v1.0.1
      - name: Remove one-time workflow from main
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git config user.name "Rohith Bommalla Naresh"
          git config user.email "bnr756@gmail.com"
          git rm .github/workflows/tag-v1.0.1.yml
          git commit -m "Remove one-time v1.0.1 tag workflow"
          git push origin main
