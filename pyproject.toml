[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immutavault"
version = "0.5.0"
description = "Highly available immutable VM backup and recovery orchestrator for VMware/vCenter, Proxmox VE, and XCP-ng"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Rohith Bommalla Naresh"}]
dependencies = ["PyYAML>=6.0,<7", "boto3>=1.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
immutavault = "immutavault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
